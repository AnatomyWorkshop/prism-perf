# Robot Shop — realistic topology with documented latencies
# Source: Instana Robot Shop demo, typical observed latencies
topology:
  name: "robot-shop-checkout"
  services:
    - name: web
      type: sync
      latency_p50: 5ms
      latency_p99: 15ms

    - name: cart
      type: sync
      latency_p50: 8ms
      latency_p99: 25ms
      connections: 10

    - name: catalogue
      type: sync
      latency_p50: 12ms
      latency_p99: 40ms
      connections: 10

    - name: user
      type: sync
      latency_p50: 15ms
      latency_p99: 50ms
      connections: 10

    - name: payment
      type: sync
      latency_p50: 180ms
      latency_p99: 600ms
      connections: 5

    - name: shipping
      type: sync
      latency_p50: 250ms
      latency_p99: 800ms
      connections: 5

    - name: dispatch
      type: async
      latency_p50: 20ms
      latency_p99: 60ms

  chain:
    - web -> cart -> catalogue -> user -> payment -> shipping

  resources:
    connection_pool: 5
    network_rtt_internal: 0.5ms

target:
  latency_p99: 200ms
  throughput: 500 qps
