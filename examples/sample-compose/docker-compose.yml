version: '3.8'

services:
  api_gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - auth_service
      - product_service

  auth_service:
    image: myapp/auth:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  product_service:
    image: myapp/products:latest
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 256M

  order_service:
    image: myapp/orders:latest
    ports:
      - "8083:8080"
    depends_on:
      - product_service
      - payment_service
      - postgres

  payment_service:
    image: myapp/payments:latest
    ports:
      - "8084:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: myapp

  redis:
    image: redis:7-alpine
